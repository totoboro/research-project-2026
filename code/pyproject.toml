[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parity-bdd-lab"
version = "0.1.0"
description = "Small parity games, exhaustive positional strategies, and BDD/MDD experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["dd>=0.6.0", "numpy>=1.24"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "matplotlib>=3.8", "networkx>=3.2", "pandas>=2.1", "pydot>=3"]
test = ["pytest>=8", "nbclient>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]
